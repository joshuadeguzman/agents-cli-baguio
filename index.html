<!DOCTYPE html>

<style>
html,body{height:100%}
body{display:flex;flex-direction:column}
nav.top{display:flex;justify-content:flex-end;gap:.4rem;padding:1.1rem 1.4rem}
nav.top a{padding:.5em 1em;border-radius:var(--pill);font-size:.9rem;font-weight:500;color:var(--gray);text-decoration:none}

.qr img{width:clamp(10rem,min(30vw,54vh),40rem);aspect-ratio:1;display:block;image-rendering:pixelated}
.qr p{margin-top:.8em;font-size:clamp(.85rem,min(1.2vw,2.1vh),1.5rem);color:var(--gray-2)}
nav.top a{font-size:clamp(.85rem,min(1vw,1.8vh),1.2rem)}
